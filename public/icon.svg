<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas: Warm cozy cream squircle -->
    <linearGradient id="bgCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ec" />
      <stop offset="50%" stop-color="#f5efe4" />
      <stop offset="100%" stop-color="#ece4d4" />
    </linearGradient>

    <!-- Turtle Head Skin Gradient (Warm Sage/Olive Green) -->
    <radialGradient id="turtleHead" cx="48%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#dde1c0" />
      <stop offset="50%" stop-color="#cad0a5" />
      <stop offset="85%" stop-color="#b6bc8d" />
      <stop offset="100%" stop-color="#9fa676" />
    </radialGradient>

    <!-- Turtle Limbs Skin Gradient -->
    <radialGradient id="turtleLimb" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d6dcba" />
      <stop offset="60%" stop-color="#bfc696" />
      <stop offset="100%" stop-color="#a4ab7b" />
    </radialGradient>

    <!-- Turtle Shell Outer (Rich Warm Cocoa Earth Brown) -->
    <radialGradient id="shellOuter" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9a7657" />
      <stop offset="50%" stop-color="#805d40" />
      <stop offset="85%" stop-color="#69482d" />
      <stop offset="100%" stop-color="#543820" />
    </radialGradient>

    <!-- Shell Inner Rim (Warm Sandy Tan) -->
    <linearGradient id="shellRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9dcbf" />
      <stop offset="100%" stop-color="#d4c29e" />
    </linearGradient>

    <!-- Belly Plastron (Creamy Warm Yellow Tan) -->
    <linearGradient id="bellyPlastron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e7" />
      <stop offset="40%" stop-color="#f5e8cf" />
      <stop offset="85%" stop-color="#ebd3ad" />
      <stop offset="100%" stop-color="#dfc499" />
    </linearGradient>

    <!-- Book Cover (Earthy Muted Olive-Sage Green) -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8b290" />
      <stop offset="40%" stop-color="#95a07c" />
      <stop offset="100%" stop-color="#7a8562" />
    </linearGradient>

    <!-- Coffee inside Mug -->
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#63391b" />
      <stop offset="100%" stop-color="#45230c" />
    </linearGradient>

    <!-- Heart in Bubble (Warm Coral Red) -->
    <linearGradient id="heartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9695d" />
      <stop offset="100%" stop-color="#d24f43" />
    </linearGradient>

    <!-- Soft Cheek Blush -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e87e74" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ed938a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ed938a" stop-opacity="0" />
    </radialGradient>

    <!-- Character Ground Soft Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5c4431" flood-opacity="0.14" />
    </filter>

    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#805d40" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base Container -->
  <rect x="8" y="8" width="496" height="496" rx="116" ry="116" fill="url(#bgCream)" stroke="#ece2d0" stroke-width="4" />

  <!-- Ground Soft Shadow Under Turtle -->
  <ellipse cx="256" cy="455" rx="158" ry="18" fill="#805d40" opacity="0.22" />
  <ellipse cx="256" cy="453" rx="120" ry="11" fill="#543820" opacity="0.18" />

  <!-- 2. MAIN CHARACTER GROUP -->
  <g filter="url(#softShadow)">

    <!-- TURTLE SHELL (Deep Earth Brown with textured rim scutes) -->
    <g>
      <!-- Outer Shell Silhouette -->
      <path d="M110,310 C100,240 145,178 256,175 C367,178 412,240 402,310 C395,365 372,416 335,438 C290,455 222,455 177,438 C140,416 117,365 110,310 Z"
            fill="url(#shellOuter)" stroke="#452c17" stroke-width="5" stroke-linejoin="round" />

      <!-- Inner Shell Rim Cream Band -->
      <path d="M128,308 C120,250 156,200 256,198 C356,200 392,250 384,308 C378,355 358,402 326,420 C286,436 226,436 186,420 C154,402 134,355 128,308 Z"
            fill="none" stroke="url(#shellRim)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

      <!-- Individual Shell Scutes Segments (Left & Right Flanges) -->
      <!-- Left Rim Scutes -->
      <path d="M116,260 C125,258 138,266 142,285 C132,290 120,288 112,280 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M110,305 C122,302 138,310 140,330 C128,335 116,330 110,320 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M118,348 C130,344 144,352 148,372 C136,378 124,370 116,360 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M136,390 C148,385 160,392 166,410 C152,416 140,408 132,400 Z" fill="#755236" stroke="#452c17" stroke-width="3" />

      <!-- Right Rim Scutes -->
      <path d="M396,260 C387,258 374,266 370,285 C380,290 392,288 400,280 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M402,305 C390,302 374,310 372,330 C384,335 396,330 402,320 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M394,348 C382,344 368,352 364,372 C376,378 388,370 396,360 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
      <path d="M376,390 C364,385 352,392 346,410 C360,416 372,408 380,400 Z" fill="#755236" stroke="#452c17" stroke-width="3" />
    </g>

    <!-- TURTLE BELLY PLASTRON (Warm cream with horizontal & vertical grooved plates) -->
    <g>
      <!-- Base Belly Silhouette -->
      <path d="M182,280 C182,280 215,270 256,270 C297,270 330,280 330,280 C345,320 348,380 336,415 C310,442 285,448 256,448 C227,448 202,442 176,415 C164,380 167,320 182,280 Z"
            fill="url(#bellyPlastron)" stroke="#826243" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Horizontal Plastron Division Grooves -->
      <path d="M180,314 Q256,322 332,314" stroke="#ab8c69" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M174,352 Q256,360 338,352" stroke="#ab8c69" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M180,388 Q256,396 332,388" stroke="#ab8c69" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M198,422 Q256,428 314,422" stroke="#ab8c69" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Center Vertical Division Line -->
      <path d="M256,272 L256,445" stroke="#ab8c69" stroke-width="3.5" stroke-linecap="round" />

      <!-- Subtle inner shade on plastron boundaries -->
      <path d="M180,282 C170,330 172,390 182,416" stroke="#cbb38e" stroke-width="3" fill="none" opacity="0.6" />
      <path d="M332,282 C342,330 340,390 330,416" stroke="#cbb38e" stroke-width="3" fill="none" opacity="0.6" />
    </g>

    <!-- BACK FEET (Two round chubby sage-green feet at bottom) -->
    <!-- Left Foot -->
    <g>
      <ellipse cx="180" cy="432" rx="36" ry="26" fill="url(#turtleLimb)" stroke="#453221" stroke-width="4.5" />
      <!-- Foot Spots -->
      <ellipse cx="166" cy="426" rx="6" ry="5" fill="#889262" opacity="0.75" />
      <ellipse cx="182" cy="436" rx="5.5" ry="4.5" fill="#889262" opacity="0.75" />
      <ellipse cx="196" cy="428" rx="5" ry="4" fill="#889262" opacity="0.75" />
      <!-- Gentle toe indent lines -->
      <path d="M162,448 C166,440 170,442 174,450" stroke="#453221" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M182,453 C186,445 190,447 194,453" stroke="#453221" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Foot -->
    <g>
      <ellipse cx="332" cy="432" rx="36" ry="26" fill="url(#turtleLimb)" stroke="#453221" stroke-width="4.5" />
      <!-- Foot Spots -->
      <ellipse cx="346" cy="426" rx="6" ry="5" fill="#889262" opacity="0.75" />
      <ellipse cx="330" cy="436" rx="5.5" ry="4.5" fill="#889262" opacity="0.75" />
      <ellipse cx="316" cy="428" rx="5" ry="4" fill="#889262" opacity="0.75" />
      <!-- Gentle toe indent lines -->
      <path d="M318,453 C322,445 326,447 330,453" stroke="#453221" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M338,450 C342,442 346,440 350,448" stroke="#453221" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- CHUBBY ARMS HOLDING THE COFFEE MUG AND BOOK -->
    <!-- Left Arm (Holding Coffee Mug) -->
    <g>
      <path d="M186,290 C156,298 132,326 130,360 C128,390 152,408 178,400 C194,395 200,378 196,356 C194,334 190,305 186,290 Z"
            fill="url(#turtleLimb)" stroke="#453221" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Spots on left arm -->
      <circle cx="150" cy="336" r="6" fill="#889262" opacity="0.75" />
      <circle cx="162" cy="324" r="5.5" fill="#889262" opacity="0.75" />
      <circle cx="144" cy="358" r="6.5" fill="#889262" opacity="0.75" />
      <circle cx="158" cy="370" r="5" fill="#889262" opacity="0.75" />
    </g>

    <!-- Right Arm (Holding Book) -->
    <g>
      <path d="M326,290 C356,298 380,326 382,360 C384,390 360,408 334,400 C318,395 312,378 316,356 C318,334 322,305 326,290 Z"
            fill="url(#turtleLimb)" stroke="#453221" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Spots on right arm -->
      <circle cx="362" cy="336" r="6" fill="#889262" opacity="0.75" />
      <circle cx="350" cy="324" r="5.5" fill="#889262" opacity="0.75" />
      <circle cx="368" cy="358" r="6.5" fill="#889262" opacity="0.75" />
      <circle cx="354" cy="370" r="5" fill="#889262" opacity="0.75" />
    </g>

    <!-- LEFT HAND ITEM: WHITE COFFEE MUG WITH "Good Food Good Day ☺" -->
    <g transform="translate(142, 320)">
      <!-- Mug Shadow -->
      <ellipse cx="50" cy="85" rx="36" ry="9" fill="#543820" opacity="0.18" />

      <!-- Mug Handle on the left -->
      <path d="M22,26 C-4,26 -4,64 22,64" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      <path d="M22,26 C-4,26 -4,64 22,64" fill="none" stroke="#453221" stroke-width="4.5" stroke-linecap="round" />
      <!-- Handle inner hole -->
      <path d="M20,34 C6,34 6,56 20,56" fill="none" stroke="#453221" stroke-width="4.5" stroke-linecap="round" />

      <!-- Mug Body -->
      <path d="M20,18 C20,12 80,12 80,18 L76,78 C76,85 24,85 24,78 Z"
            fill="#ffffff" stroke="#453221" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Mug Rim & Warm Coffee Surface Inside -->
      <ellipse cx="50" cy="18" rx="28" ry="8" fill="#e8dfce" stroke="#453221" stroke-width="4" />
      <ellipse cx="50" cy="19" rx="23" ry="5.5" fill="url(#coffeeGrad)" />

      <!-- Text on Mug: "Good Food Good Day ☺" in cute hand lettering -->
      <text x="50" y="38" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
            font-size="12" font-weight="800" fill="#3a2514" text-anchor="middle" letter-spacing="0.2">Good</text>
      <text x="50" y="52" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
            font-size="12" font-weight="800" fill="#3a2514" text-anchor="middle" letter-spacing="0.2">Food</text>
      <text x="50" y="66" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
            font-size="10.5" font-weight="800" fill="#3a2514" text-anchor="middle" letter-spacing="0.1">Good Day</text>
      <!-- Smiley Face below -->
      <circle cx="47" cy="74" r="1.2" fill="#3a2514" />
      <circle cx="53" cy="74" r="1.2" fill="#3a2514" />
      <path d="M46.5,77 Q50,80 53.5,77" fill="none" stroke="#3a2514" stroke-width="1.3" stroke-linecap="round" />

      <!-- Left Chubby Paw Wrapping Over Mug Handle/Front -->
      <g transform="translate(14, 40)">
        <ellipse cx="0" cy="0" rx="9" ry="14" fill="url(#turtleLimb)" stroke="#453221" stroke-width="3.5" transform="rotate(-15)" />
        <ellipse cx="-2" cy="-4" rx="2.5" ry="3" fill="#889262" opacity="0.6" />
      </g>
    </g>

    <!-- RIGHT HAND ITEM: HARDCOVER BOOK WITH "Better Days :-)" -->
    <g transform="translate(290, 305) rotate(4)">
      <!-- Book Shadow -->
      <ellipse cx="44" cy="104" rx="34" ry="8" fill="#543820" opacity="0.18" />

      <!-- Book Pages Block (Cream/White on top & sides) -->
      <path d="M12,16 L48,6 L56,76 L20,86 Z" fill="#fffdfa" stroke="#453221" stroke-width="3" stroke-linejoin="round" />
      <!-- Book Top Pages lines -->
      <path d="M16,15 L46,7" stroke="#b0a594" stroke-width="1.8" />
      <path d="M18,17 L48,9" stroke="#b0a594" stroke-width="1.8" />

      <!-- Book Front Cover (Sage-Green) -->
      <path d="M2,18 C2,18 20,24 58,16 L66,94 C34,101 10,95 10,95 Z"
            fill="url(#bookCover)" stroke="#453221" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Book Spine (Left thickness) -->
      <path d="M2,18 L10,95 L2,93 Z" fill="#5c6747" stroke="#453221" stroke-width="3.5" />

      <!-- Text on Book: "Better Days :-)" in sweet hand lettering -->
      <text x="36" y="50" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
            font-size="13" font-weight="800" fill="#2d3320" text-anchor="middle" letter-spacing="0.2">Better</text>
      <text x="36" y="66" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Arial Rounded MT Bold', sans-serif"
            font-size="13" font-weight="800" fill="#2d3320" text-anchor="middle" letter-spacing="0.2">Days</text>
      <!-- Smiley Face below (.-)) -->
      <path d="M31,77 Q36,83 41,77" fill="none" stroke="#2d3320" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="33" cy="74" r="1.3" fill="#2d3320" />
      <circle cx="39" cy="74" r="1.3" fill="#2d3320" />

      <!-- Right Chubby Paw Clasping the Book from Edge -->
      <g transform="translate(62, 54)">
        <ellipse cx="0" cy="0" rx="9" ry="14" fill="url(#turtleLimb)" stroke="#453221" stroke-width="3.5" transform="rotate(20)" />
        <circle cx="0" cy="-2" r="2.5" fill="#889262" opacity="0.6" />
      </g>
    </g>

    <!-- BIG ADORABLE ROUNDED HEAD (Sage Green with spots and lovable expression) -->
    <g>
      <!-- Head Base Dome -->
      <path d="M165,220 C145,150 185,95 256,92 C327,95 367,150 347,220 C336,258 304,282 256,284 C208,282 176,258 165,220 Z"
            fill="url(#turtleHead)" stroke="#453221" stroke-width="5.5" stroke-linejoin="round" />

      <!-- Head Top Gentle Highlights -->
      <ellipse cx="236" cy="120" rx="44" ry="20" fill="#ffffff" opacity="0.22" />

      <!-- TORTOISE SPOTS ON FOREHEAD AND CROWN (Natural watercolor texture spots) -->
      <g fill="#889262" opacity="0.75">
        <!-- Top Crown Spots -->
        <ellipse cx="256" cy="118" rx="9" ry="7" />
        <ellipse cx="238" cy="130" rx="8" ry="6.5" />
        <ellipse cx="274" cy="130" rx="8" ry="6.5" />
        <ellipse cx="218" cy="142" rx="7" ry="5.5" />
        <ellipse cx="294" cy="142" rx="7" ry="5.5" />
        <ellipse cx="256" cy="140" rx="9.5" ry="7.5" />

        <!-- Mid Brow Spots -->
        <ellipse cx="236" cy="154" rx="7.5" ry="6" />
        <ellipse cx="276" cy="154" rx="7.5" ry="6" />
        <ellipse cx="256" cy="162" rx="7" ry="5" />
        <ellipse cx="204" cy="162" rx="6" ry="5" />
        <ellipse cx="308" cy="162" rx="6" ry="5" />
      </g>

      <!-- DELICATE EYEBROWS -->
      <path d="M196,170 Q208,165 218,171" fill="none" stroke="#686e4e" stroke-width="2.5" stroke-linecap="round" />
      <path d="M316,170 Q304,165 294,171" fill="none" stroke="#686e4e" stroke-width="2.5" stroke-linecap="round" />

      <!-- BIG, GLOSSY, SOULFUL DARK EYES -->
      <!-- Left Eye -->
      <g>
        <ellipse cx="206" cy="195" rx="14" ry="17" fill="#241a12" stroke="#453221" stroke-width="2" />
        <!-- Big White Catchlight Highlight -->
        <circle cx="202" cy="188" r="5" fill="#ffffff" />
        <!-- Secondary small sparkle highlight -->
        <circle cx="212" cy="202" r="2.2" fill="#ffffff" opacity="0.85" />
      </g>

      <!-- Right Eye -->
      <g>
        <ellipse cx="306" cy="195" rx="14" ry="17" fill="#241a12" stroke="#453221" stroke-width="2" />
        <!-- Big White Catchlight Highlight -->
        <circle cx="302" cy="188" r="5" fill="#ffffff" />
        <!-- Secondary small sparkle highlight -->
        <circle cx="312" cy="202" r="2.2" fill="#ffffff" opacity="0.85" />
      </g>

      <!-- ROSY CHEEK BLUSH (Soft and warm with subtle hand-drawn hatch lines) -->
      <!-- Left Cheek -->
      <ellipse cx="178" cy="225" rx="26" ry="18" fill="url(#cheekBlush)" />
      <g stroke="#d96a60" stroke-width="2" stroke-linecap="round" opacity="0.45">
        <line x1="168" y1="228" x2="176" y2="218" />
        <line x1="176" y1="231" x2="184" y2="221" />
        <line x1="184" y1="232" x2="192" y2="222" />
      </g>

      <!-- Right Cheek -->
      <ellipse cx="334" cy="225" rx="26" ry="18" fill="url(#cheekBlush)" />
      <g stroke="#d96a60" stroke-width="2" stroke-linecap="round" opacity="0.45">
        <line x1="320" y1="232" x2="328" y2="222" />
        <line x1="328" y1="231" x2="336" y2="221" />
        <line x1="336" y1="228" x2="344" y2="218" />
      </g>

      <!-- CUTE NOSTRILS (Two tiny dots in center) -->
      <ellipse cx="249" cy="204" rx="2.5" ry="3.2" fill="#453221" />
      <ellipse cx="263" cy="204" rx="2.5" ry="3.2" fill="#453221" />

      <!-- SWEET GENTLE SMILE (~‿~) -->
      <path d="M232,224 Q244,238 256,238 Q268,238 280,224"
            fill="none" stroke="#362211" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Dimple accents -->
      <path d="M230,222 Q232,226 234,226" fill="none" stroke="#362211" stroke-width="3" stroke-linecap="round" />
      <path d="M282,222 Q280,226 278,226" fill="none" stroke="#362211" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 3. UPPER RIGHT FLOATING SPEECH BUBBLE WITH RED HEART -->
    <g filter="url(#bubbleShadow)" transform="translate(362, 54)">
      <!-- Bubble Body & Pointer Tail -->
      <path d="M46,10 C74,10 94,28 94,52 C94,76 74,94 46,94 C38,94 30,92 24,88 L8,96 L14,78 C10,70 8,62 8,52 C8,28 28,10 46,10 Z"
            fill="#ffffff" stroke="#5c4431" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Warm Red Coral Heart Inside Bubble -->
      <path d="M51,68 C51,68 32,54 32,41 C32,32 38,26 46,26 C50,26 53,29 55,33 C57,29 60,26 64,26 C72,26 78,32 78,41 C78,54 59,68 59,68 L55,72 Z"
            fill="url(#heartRed)" />

      <!-- Soft shine highlight on heart -->
      <path d="M38,34 C36,38 36,44 42,48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

  </g>
</svg>
