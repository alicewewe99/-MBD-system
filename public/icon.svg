<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <linearGradient id="appBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Turtle Head & Skin Gradients (Kawaii Soft Lime / Mint) -->
    <linearGradient id="turtleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="30%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="turtleBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Turtle Shell Outer Rim (Caramel / Honey Warm Tone) -->
    <linearGradient id="shellRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Turtle Shell Dome (Emerald & Forest Tone or Warm Amber Shell) -->
    <radialGradient id="shellDome" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </radialGradient>

    <linearGradient id="scuteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Mushroom Cap on Head -->
    <radialGradient id="mushCap" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#065f46" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Vibrant Rounded Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#appBorder)" stroke-width="14" />
  
  <!-- Subtle Inner Ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" ry="96" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.75" />

  <!-- Playful Background Deco Elements -->
  <!-- Cute yellow stars & bubbles -->
  <g fill="#f59e0b" opacity="0.6">
    <circle cx="95" cy="110" r="14" fill="#6ee7b7" opacity="0.4" />
    <circle cx="120" cy="85" r="8" fill="#a7f3d0" opacity="0.5" />
    <path d="M410,95 L415,108 L428,112 L415,117 L410,130 L405,117 L392,112 L405,108 Z" fill="#fbbf24" opacity="0.8" />
    <circle cx="430" cy="150" r="6" fill="#fbbf24" opacity="0.6" />
    <circle cx="85" cy="380" r="10" fill="#fde68a" opacity="0.8" />
  </g>

  <!-- Ground Soft Shadow -->
  <ellipse cx="256" cy="436" rx="145" ry="20" fill="#78350f" opacity="0.16" />

  <!-- MAIN CHARACTER: KAWAII CHIBI TURTLE -->
  <g filter="url(#softGaze)">

    <!-- Back Feet / Flippers (Behind Shell) -->
    <ellipse cx="145" cy="388" rx="34" ry="24" transform="rotate(-15, 145, 388)" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="4.5" />
    <ellipse cx="367" cy="388" rx="34" ry="24" transform="rotate(15, 367, 388)" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="4.5" />
    <!-- Cute tiny claws / toes -->
    <circle cx="124" cy="392" r="4.5" fill="#ffffff" />
    <circle cx="134" cy="402" r="4.5" fill="#ffffff" />
    <circle cx="146" cy="407" r="4.5" fill="#ffffff" />
    
    <circle cx="388" cy="392" r="4.5" fill="#ffffff" />
    <circle cx="378" cy="402" r="4.5" fill="#ffffff" />
    <circle cx="366" cy="407" r="4.5" fill="#ffffff" />

    <!-- Cute Little Turtle Tail -->
    <path d="M256,410 C250,432 253,446 256,450 C259,446 262,432 256,410 Z" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="4" />

    <!-- TURTLE SHELL -->
    <!-- Outer Shell Rim (Scalloped edge) -->
    <ellipse cx="256" cy="316" rx="156" ry="120" fill="url(#shellRim)" stroke="#78350f" stroke-width="5" />
    <!-- Shell Rim Segments -->
    <ellipse cx="256" cy="316" rx="144" ry="108" fill="url(#shellDome)" stroke="#064e3b" stroke-width="4" />

    <!-- Scutes (Hexagonal Shell Patterns with cute Kawaii glow) -->
    <!-- Center Scute -->
    <polygon points="256,236 292,260 292,298 256,322 220,298 220,260" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Center Lower Scute -->
    <polygon points="256,322 288,342 288,378 256,396 224,378 224,342" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" opacity="0.9" />
    <!-- Left Scute -->
    <polygon points="220,260 256,236 215,224 165,248 165,282 220,298" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" opacity="0.85" />
    <!-- Right Scute -->
    <polygon points="256,236 292,260 292,298 347,282 347,248 297,224" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" opacity="0.85" />
    <!-- Bottom Left Scute -->
    <polygon points="220,298 224,342 178,362 145,330 165,282" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" opacity="0.8" />
    <!-- Bottom Right Scute -->
    <polygon points="292,298 347,282 367,330 334,362 288,342" fill="url(#scuteGrad)" stroke="#064e3b" stroke-width="3.5" stroke-linejoin="round" opacity="0.8" />

    <!-- Front Flippers (Waving Hands) -->
    <!-- Left Hand (Resting or Waving) -->
    <g>
      <ellipse cx="120" cy="275" rx="36" ry="26" transform="rotate(25, 120, 275)" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="5" />
      <circle cx="98" cy="272" r="4.5" fill="#ffffff" />
      <circle cx="106" cy="286" r="4.5" fill="#ffffff" />
      <circle cx="118" cy="296" r="4.5" fill="#ffffff" />
    </g>

    <!-- Right Hand (Waving Up Cheerfully!) -->
    <g>
      <ellipse cx="388" cy="245" rx="38" ry="26" transform="rotate(-35, 388, 245)" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="5" />
      <circle cx="415" cy="235" r="4.5" fill="#ffffff" />
      <circle cx="408" cy="220" r="4.5" fill="#ffffff" />
      <circle cx="395" cy="214" r="4.5" fill="#ffffff" />
      <!-- Wave Motion Sparkles -->
      <path d="M428,205 Q436,200 438,190" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M440,220 Q448,220 452,214" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- BIG ADORABLE ROUND TURTLE HEAD -->
    <g>
      <!-- Head Shadow on Body -->
      <ellipse cx="256" cy="225" rx="84" ry="74" fill="#064e3b" opacity="0.18" />

      <!-- Head Base -->
      <ellipse cx="256" cy="180" rx="96" ry="86" fill="url(#turtleSkin)" stroke="#065f46" stroke-width="5.5" />

      <!-- Cute Cheek Blush (Glowing Pink) -->
      <ellipse cx="192" cy="204" rx="20" ry="12" fill="#f43f5e" opacity="0.45" />
      <ellipse cx="320" cy="204" rx="20" ry="12" fill="#f43f5e" opacity="0.45" />

      <!-- Snout / Nose highlight -->
      <path d="M246,172 Q256,168 266,172" stroke="#047857" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <ellipse cx="250" cy="176" rx="2.5" ry="3.5" fill="#047857" />
      <ellipse cx="262" cy="176" rx="2.5" ry="3.5" fill="#047857" />

      <!-- Happy Cheerful Smile -->
      <path d="M236,192 Q256,220 276,192" fill="#dc2626" stroke="#065f46" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Tongue -->
      <path d="M244,204 Q256,218 268,204 Q256,212 244,204 Z" fill="#fda4af" />

      <!-- LEFT EYE (Super expressive Anime Kawaii Eye) -->
      <g>
        <ellipse cx="204" cy="155" rx="22" ry="28" fill="#111827" />
        <!-- Eye Iris Gradient Ring -->
        <ellipse cx="204" cy="160" rx="19" ry="20" fill="#065f46" />
        <ellipse cx="204" cy="164" rx="14" ry="14" fill="#10b981" />
        <!-- Big Twinkle Reflection -->
        <circle cx="196" cy="144" r="9" fill="#ffffff" />
        <circle cx="212" cy="168" r="4.5" fill="#ffffff" />
        <!-- Cute Eyelash Accent -->
        <path d="M184,136 Q204,130 224,136" stroke="#065f46" stroke-width="4" stroke-linecap="round" fill="none" />
      </g>

      <!-- RIGHT EYE (Super expressive Anime Kawaii Eye) -->
      <g>
        <ellipse cx="308" cy="155" rx="22" ry="28" fill="#111827" />
        <!-- Eye Iris Gradient Ring -->
        <ellipse cx="308" cy="160" rx="19" ry="20" fill="#065f46" />
        <ellipse cx="308" cy="164" rx="14" ry="14" fill="#10b981" />
        <!-- Big Twinkle Reflection -->
        <circle cx="300" cy="144" r="9" fill="#ffffff" />
        <circle cx="316" cy="168" r="4.5" fill="#ffffff" />
        <!-- Cute Eyelash Accent -->
        <path d="M288,136 Q308,130 328,136" stroke="#065f46" stroke-width="4" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- MINI RED MUSHROOM BERET ON HEAD (Ties with Yoshi / Mushroom Island) -->
    <g transform="translate(230, 68) rotate(12)">
      <!-- Mushroom Stem -->
      <path d="M20,32 L20,44 C20,48 40,48 40,44 L40,32 Z" fill="#fef9c3" stroke="#78350f" stroke-width="3" />
      <!-- Mushroom Cap -->
      <path d="M4,32 C4,10 56,10 56,32 Z" fill="url(#mushCap)" stroke="#7f1d1d" stroke-width="3.5" />
      <!-- White Polka Dots -->
      <circle cx="22" cy="22" r="5.5" fill="#ffffff" />
      <circle cx="38" cy="18" r="6" fill="#ffffff" />
      <circle cx="48" cy="26" r="3.5" fill="#ffffff" />
      <circle cx="12" cy="26" r="3.5" fill="#ffffff" />
      <!-- Little Leaf Sprout -->
      <path d="M30,10 Q38,2 44,8 Q40,14 30,10 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    </g>

  </g>
</svg>
